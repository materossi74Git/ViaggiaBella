name: Build ViaggiaBella Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets & Sync Capacitor
        run: npm run cap:build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 platform-tools'

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./ViaggiaBella.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViaggiaBella-APK
          path: ./ViaggiaBella.apk

      - name: Release Latest APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "ViaggiaBella - Ultima versione APK"
          body: |
            ### 🚐 ViaggiaBella APK Aggiornata
            - Nome mezzo dinamico all'avvio rapido con NFC e QR Code
            - Rilevamento automatico coordinate e posizione GPS (partenza e arrivo)
            - Niente più obbligo di inserimento Km
            - Correzione accesso con account Google su Android
            - Controllo automatico aggiornamenti integrato
          files: ./ViaggiaBella.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

